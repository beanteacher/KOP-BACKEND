server:
  port: 3002

spring:
  application:
    name: finance-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kop}
    username: ${DB_USERNAME:kop}
    password: ${DB_PASSWORD:kop}
    hikari:
      schema: finance

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: finance
        format_sql: false

  flyway:
    schemas: finance
    default-schema: finance
    locations: classpath:db/migration

# auth-service·api-gateway와 반드시 같은 값을 써야 한다(서명 검증 공유 시크릿).
# 로컬 기본값일 뿐 — 운영은 08-deployment.md Secrets Manager에서 주입.
jwt:
  secret: ${JWT_SECRET:local-dev-only-change-me-0123456789abcdef}

# bank_accounts.fintech_use_num/access_token/refresh_token 암호화 키 — 09-security.md 예외 조항.
# auth-service의 값과 같을 필요는 없다(암호문은 서비스 간에 공유되지 않는다). salt는 hex 문자열.
# 로컬 기본값일 뿐 — 운영은 08-deployment.md Secrets Manager에서 주입.
app:
  encryption:
    secret: ${ENCRYPTION_SECRET:local-dev-only-change-me-0123456789abcdef}
    salt: ${ENCRYPTION_SALT:d1b1d1e1f1a1b1c1d1e1f1a1b1c1d1e1}

# 금융결제원 오픈뱅킹 — 이용기관 등록(심사) 전까지는 MockBankTransactionGateway만 쓰므로 여기
# 값들은 아직 어떤 코드에서도 읽지 않는다. 실제 HTTP 클라이언트 구현체를 붙일 때 쓸 자리를
# 미리 마련해둔 것 — developers.openbanking.or.kr 테스트베드에서 Client ID/Secret 발급 후
# finance-service/.env(gitignore 처리, spring-dotenv가 읽음)에 채워 넣는다.
openbanking:
  base-url: ${OPENBANKING_BASE_URL:https://testapi.openbanking.or.kr}
  client-id: ${OPENBANKING_CLIENT_ID:}
  client-secret: ${OPENBANKING_CLIENT_SECRET:}
  redirect-uri: ${OPENBANKING_REDIRECT_URI:http://localhost:5173/settings/bank-account/callback}

management:
  endpoints:
    web:
      exposure:
        include: health,info
