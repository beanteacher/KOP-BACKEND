server:
  port: 3001

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kitchensys}
    username: ${DB_USERNAME:kitchensys}
    password: ${DB_PASSWORD:kitchensys}
    hikari:
      schema: auth

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
        format_sql: false

  flyway:
    schemas: auth
    default-schema: auth
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# jwt.secret은 api-gateway와 반드시 같은 값을 써야 한다(서명 검증 공유 시크릿).
# 로컬 기본값일 뿐 — 운영은 08-deployment.md Secrets Manager에서 주입.
jwt:
  secret: ${JWT_SECRET:local-dev-only-change-me-0123456789abcdef}
  access-token-ttl-minutes: 60
  refresh-token-ttl-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
