server:
  port: 3001

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kop}
    username: ${DB_USERNAME:kop}
    password: ${DB_PASSWORD:kop}
    hikari:
      schema: auth

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
        format_sql: false

  flyway:
    schemas: auth
    default-schema: auth
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# jwt.secret은 api-gateway와 반드시 같은 값을 써야 한다(서명 검증 공유 시크릿).
# 로컬 기본값일 뿐 — 운영은 08-deployment.md Secrets Manager에서 주입.
jwt:
  secret: ${JWT_SECRET:local-dev-only-change-me-0123456789abcdef}
  access-token-ttl-minutes: 60
  refresh-token-ttl-days: 30

# companies.bank_account_number 앱 레벨 암호화 키 — 09-security.md 예외 조항 참고.
# salt는 hex 문자열이어야 한다(Spring Security Encryptors 요구사항).
# 로컬 기본값일 뿐 — 운영은 08-deployment.md Secrets Manager에서 주입.
app:
  encryption:
    secret: ${ENCRYPTION_SECRET:local-dev-only-change-me-0123456789abcdef}
    salt: ${ENCRYPTION_SALT:d1b1d1e1f1a1b1c1d1e1f1a1b1c1d1e1}

# 08-deployment.md — 운영 메일 발송은 AWS SES. 기본값 logging이면 LoggingEmailSender(로그만
# 남김)가 활성화된다 — AWS 자격증명 없이도 로컬 개발이 그대로 된다. ses로 바꾸면 SesEmailSender가
# 활성화되는데, AWS 자격증명 자체는 SDK 기본 체인(환경변수 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY,
# ~/.aws/credentials, 운영은 IAM Role)을 그대로 쓴다 — 여기서 별도로 안 받는다.
# from-address는 SES에 검증된(verified) 이메일/도메인이어야 한다.
email:
  provider: ${EMAIL_PROVIDER:logging}
  ses:
    region: ${AWS_SES_REGION:ap-northeast-2}
    from-address: ${EMAIL_FROM_ADDRESS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
