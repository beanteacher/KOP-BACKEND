version: '3.8'

# 로컬 개발용 인프라. 08-deployment.md의 운영 구성(RDS/MSK/ElastiCache)과 스펙은 다르지만
# 스키마 분리·토픽 이름 같은 "모양"은 최대한 그대로 맞춘다.
# project name을 폴더명과 무관하게 고정 — 폴더를 옮기거나 이름이 바뀌어도 항상 같은
# 컨테이너·named volume(kop-backend_*)을 찾아간다.
name: kop-backend
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kitchensys
      POSTGRES_PASSWORD: kitchensys
      POSTGRES_DB: kitchensys
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kitchensys']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

volumes:
  postgres-data:
